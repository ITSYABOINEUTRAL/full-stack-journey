<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="spinner.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Random User Generator</title>
  <base target="_blank">
</head>
  <body class="bg-purple-800 text-white overflow-x-hidden">
    <div
      class="relative max-w-2xl mx-auto mt-6 sm:mt-12 border border-white rounded-lg p-4 mx-4 sm:mx-auto"
    >
      <div class="text-center">
        <h1 class="text-2xl">Random User Generator</h1>
        <button
          id="generate"
          class="relative bg-black text-white px-4 py-2 rounded w-full my-4 min-h-[40px]"
        >
          <div class="spinner hidden"></div>
          <span id="generate-label">Generate User</span>
        </button>
      </div>

      <div id="user" class="mt-6"></div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
